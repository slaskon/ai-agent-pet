<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System Schema</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Solar System Schema</h1>
    <p>A simple visual layout of the solar system showing the Sun and inner planets.</p>
  </header>

  <main>
    <section class="solar-system">
      <div class="orbit orbit-mercury">
        <div class="planet mercury" title="Mercury"></div>
      </div>
      <div class="orbit orbit-venus">
        <div class="planet venus" title="Venus"></div>
      </div>
      <div class="orbit orbit-earth">
        <div class="planet earth" title="Earth"></div>
      </div>
      <div class="orbit orbit-mars">
        <div class="planet mars" title="Mars"></div>
      </div>
      <div class="sun" title="Sun"></div>
    </section>

    <section class="legend">
      <h2>Solar System Key</h2>
      <ul>
        <li><span class="marker sun"></span> Sun</li>
        <li><span class="marker mercury"></span> Mercury</li>
        <li><span class="marker venus"></span> Venus</li>
        <li><span class="marker earth"></span> Earth</li>
        <li><span class="marker mars"></span> Mars</li>
      </ul>
    </section>
  </main>
</body>
</html>
