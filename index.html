<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System Schema</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Solar System Schema</h1>
    <p>Real planetary positions showing the Sun and inner planets.</p>
  </header>

  <main>
    <section class="date-navigation">
      <button id="prevBtn" class="nav-button" aria-label="Previous day">←</button>
      <div class="date-display">
        <span id="dateLabel"></span>
      </div>
      <button id="nextBtn" class="nav-button" aria-label="Next day">→</button>
    </section>

    <section class="solar-system">
      <div class="sun" title="Sun"></div>
      <div class="planet-container">
        <div class="orbit orbit-mercury"></div>
        <div class="planet mercury" id="mercury" title="Mercury"></div>
      </div>
      <div class="planet-container">
        <div class="orbit orbit-venus"></div>
        <div class="planet venus" id="venus" title="Venus"></div>
      </div>
      <div class="planet-container">
        <div class="orbit orbit-earth"></div>
        <div class="planet earth" id="earth" title="Earth"></div>
      </div>
      <div class="planet-container">
        <div class="orbit orbit-mars"></div>
        <div class="planet mars" id="mars" title="Mars"></div>
      </div>
    </section>

    <section class="legend">
      <h2>Solar System Key</h2>
      <ul>
        <li><span class="marker sun"></span> Sun</li>
        <li><span class="marker mercury"></span> Mercury</li>
        <li><span class="marker venus"></span> Venus</li>
        <li><span class="marker earth"></span> Earth</li>
        <li><span class="marker mars"></span> Mars</li>
      </ul>
    </section>
  </main>

  <script src="solar-system.js"></script>
</body>
</html>
